apiVersion: apps/v1
kind: Deployment
metadata:
  name: healix
  namespace: default
  labels:
    app: healix
spec:
  replicas: 3
  selector:
    matchLabels:
      app: healix
  template:
    metadata:
      labels:
        app: healix
    spec:
      containers:
      - name: healix
        image: ghcr.io/${GITHUB_REPOSITORY}:latest
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: healix-config
        - secretRef:
            name: healix-secrets
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL